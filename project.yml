name: xCleaner
options:
  bundleIdPrefix: com.pikalong
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.5"
    CURRENT_PROJECT_VERSION: "6"
    # Ký bằng certificate tự ký thay vì ad-hoc ("-"). Ad-hoc lấy chính cdhash của bản build
    # làm designated requirement, mà cdhash đổi theo từng lần build — nên macOS coi mỗi bản
    # cập nhật là một app khác và xoá sạch quyền Toàn quyền truy cập đĩa đã cấp. Ký bằng cert
    # thì requirement thành "bundle id này + cert này", cả hai đều không đổi, quyền sống qua
    # mọi lần cập nhật. Cert nằm trong login keychain của máy build, hạn tới 2036; mất private
    # key là mọi bản sau lại thành "app khác" và người dùng phải cấp quyền lại từ đầu.
    CODE_SIGN_IDENTITY: "xPaste Local Signing"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_OBJC_ARC: YES
    COMBINE_HIDPI_IMAGES: YES
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  xCleaner:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pikalong.xCleaner
        PRODUCT_NAME: xCleaner
        INFOPLIST_FILE: Sources/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/App/xCleaner.entitlements
        ENABLE_PREVIEWS: YES
